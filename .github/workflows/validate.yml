name: Validate

on:
  pull_request:
  push:
    branches: [main]

# Read-only is all validation needs.
permissions:
  contents: read

# Cancel superseded runs.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only job; don't persist credentials (artipacked).
          persist-credentials: false
      - name: Set up mise toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Validate the marketplace
        run: mise run validate
      - name: Validate the skills
        run: mise run validate-skills
