name: Zizmor

# devenv.lock is in scope because it pins zizmor: a bump brings new audits to run.
on:
  pull_request:
    paths:
      - .github/workflows/**
      - devenv.lock
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - devenv.lock

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Use the devenv binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      # zizmor's online audits need a token; the built-in one is enough.
      - name: Audit workflows with zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: devenv shell audit-workflows
