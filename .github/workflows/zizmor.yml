name: Zizmor

# mise.toml is in scope because it pins zizmor: a bump brings new audits to run.
on:
  pull_request:
    paths:
      - .github/workflows/**
      - mise.toml
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - mise.toml

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      # zizmor's online audits need a token; the built-in one is enough.
      - name: Audit workflows with zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run zizmor
